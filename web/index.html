<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glade</title>
  <link rel="stylesheet" href="/styles.css" />

  <!--
    Construct menu: version-pinned, no-build ESM leaf libraries the harness may
    reach for (documented in CLAUDE.md). These are libraries you *call* — they
    don't impose a framework. Import on demand inside a widget, e.g.
      const d3 = await import("d3");
    Pinned exact; mirror locally if you need offline.
  -->
  <script type="importmap">
  {
    "imports": {
      "d3": "https://esm.sh/d3@7.9.0",
      "chart.js": "https://esm.sh/chart.js@4.4.7/auto",
      "marked": "https://esm.sh/marked@15.0.0",
      "dompurify": "https://esm.sh/dompurify@3.2.3",
      "maplibre-gl": "https://esm.sh/maplibre-gl@4.7.1",
      "uplot": "https://esm.sh/uplot@1.6.30",
      "qrcode": "https://esm.sh/qrcode@1.5.4",
      "codemirror": "https://esm.sh/codemirror@6.0.1",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.34.1",
      "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.2",
      "@xterm/xterm": "https://esm.sh/@xterm/xterm@5.5.0",
      "@xterm/addon-fit": "https://esm.sh/@xterm/addon-fit@0.10.0"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <!-- widget grid -->
    <main id="grid" class="empty"></main>

    <!-- generation window — a live feed of the harness actually working -->
    <div id="genwrap" hidden>
      <button type="button" id="genrestore" class="gen-restore" aria-label="Show build progress" title="Show build progress">
        <span class="mini-flame" aria-hidden="true">
          <span class="mini-flame-back"></span>
          <span class="mini-flame-mid"></span>
          <span class="mini-flame-front"></span>
        </span>
      </button>
      <div id="genwindow" role="dialog" aria-label="Build progress">
        <button type="button" id="genclose" class="gen-close" aria-label="Hide build progress" title="Hide build progress"></button>
        <div class="flame-loader" aria-hidden="true">
          <span class="flame flame-back"></span>
          <span class="flame flame-mid"></span>
          <span class="flame flame-front"></span>
          <span class="ember ember-one"></span>
          <span class="ember ember-two"></span>
        </div>
        <div id="genfeed"></div>
        <div id="genstatus" role="status" aria-live="polite">igniting build</div>
      </div>
    </div>

    <!-- env side panel -->
    <aside id="envpanel" class="glass" hidden>
      <h2 id="envtitle">This widget needs a few keys</h2>
      <form id="envform"></form>
      <div class="env-actions">
        <button type="button" id="envsave" class="g-btn primary">Save</button>
        <button type="button" id="envskip" class="g-btn">Later</button>
      </div>
    </aside>

    <!-- command palette -->
    <div id="palette" hidden>
      <div id="palettebox" class="glass" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palinput" class="g-input" placeholder="Type a command" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="pallist" aria-autocomplete="list" />
        <div id="pallist" role="listbox" aria-label="Commands"></div>
      </div>
    </div>

    <!-- command bar -->
    <div id="dock">
      <div id="thumbs" hidden></div>
      <form id="cmd" class="glass">
        <button type="button" id="attach" class="icon-btn" aria-label="Attach file" title="Attach file"></button>
        <input id="imgfile" type="file" multiple hidden />
        <input id="prompt" type="text" autocomplete="off" spellcheck="false"
               placeholder="What should Glade become?" />
        <button type="button" id="mic" class="icon-btn" aria-label="Start voice input" title="Start voice input"></button>
        <button type="submit" id="go" class="icon-btn primary" aria-label="Send prompt" title="Send prompt"></button>
      </form>
      <div id="dockbar">
        <button type="button" id="harnesspill" class="pill harness-pill" title="Switch harness" aria-label="Switch harness"></button>
        <div id="layoutswitch" class="segmented" role="group" aria-label="Window layout">
          <button type="button" id="freeformmode" aria-pressed="true" title="Freeform windows">Free</button>
          <button type="button" id="snapmode" aria-pressed="false" title="Snap windows to panels">Snap</button>
        </div>
        <div id="snappresetwrap" class="snap-preset-wrap">
          <button type="button" id="snappresetbtn" class="pill"
                  aria-haspopup="menu" aria-expanded="false" title="Snap grid preset">3x3</button>
          <div id="snappresetmenu" class="snap-preset-menu glass" role="menu" aria-label="Snap grid preset" hidden>
            <button type="button" role="menuitemradio" data-preset="3" aria-checked="true">3x3</button>
            <button type="button" role="menuitemradio" data-preset="6" aria-checked="false">6x6</button>
            <button type="button" role="menuitemradio" data-preset="9" aria-checked="false">9x9</button>
          </div>
        </div>
        <span id="hint" aria-hidden="true"></span>
        <button type="button" id="librarybtn" class="pill" title="Widget library" aria-label="Open widget library"></button>
        <button type="button" id="palettebtn" class="pill" title="Commands (/)" aria-label="Open command palette">/ Commands</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
