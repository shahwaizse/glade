<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glade</title>
  <link rel="stylesheet" href="/styles.css" />

  <!--
    Construct menu: version-pinned, no-build ESM leaf libraries the harness may
    reach for (documented in CLAUDE.md). These are libraries you *call* — they
    don't impose a framework. Import on demand inside a widget, e.g.
      const THREE = await import("three");
    Pinned exact; mirror locally if you need offline.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/": "https://esm.sh/three@0.160.0/",
      "d3": "https://esm.sh/d3@7.9.0",
      "chart.js": "https://esm.sh/chart.js@4.4.7/auto",
      "marked": "https://esm.sh/marked@15.0.0",
      "dompurify": "https://esm.sh/dompurify@3.2.3",
      "maplibre-gl": "https://esm.sh/maplibre-gl@4.7.1",
      "uplot": "https://esm.sh/uplot@1.6.30",
      "qrcode": "https://esm.sh/qrcode@1.5.4",
      "codemirror": "https://esm.sh/codemirror@6.0.1",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.34.1",
      "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.2",
      "@xterm/xterm": "https://esm.sh/@xterm/xterm@5.5.0",
      "@xterm/addon-fit": "https://esm.sh/@xterm/addon-fit@0.10.0"
    }
  }
  </script>
</head>
<body>
  <!-- SVG filters for liquid glass (displacement map injected by glass.js) -->
  <svg class="defs" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feImage id="lg-map" href="" x="0" y="0" width="100%" height="100%" result="map" preserveAspectRatio="none" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div id="stage">
    <!-- ambient background -->
    <div class="ambient a1"></div>
    <div class="ambient a2"></div>

    <!-- widget grid -->
    <main id="grid" class="empty"></main>

    <!-- generation window — a live feed of the harness actually working -->
    <div id="genwrap" hidden>
      <div id="genwindow">
        <div class="gen-aurora"></div>
        <div id="genfeed"></div>
        <div class="gen-veil"></div>
        <div id="genstatus">conjuring…</div>
      </div>
    </div>

    <!-- env side panel -->
    <aside id="envpanel" class="glass" hidden>
      <h2 id="envtitle">This widget needs a few keys</h2>
      <form id="envform"></form>
      <div class="env-actions">
        <button type="button" id="envsave" class="g-btn primary">Save</button>
        <button type="button" id="envskip" class="g-btn">Later</button>
      </div>
    </aside>

    <!-- command palette -->
    <div id="palette" hidden>
      <div id="palettebox" class="glass">
        <input id="palinput" class="g-input" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
        <div id="pallist"></div>
      </div>
    </div>

    <!-- command bar -->
    <div id="dock">
      <div id="thumbs" hidden></div>
      <form id="cmd" class="glass">
        <button type="button" id="attach" aria-label="Attach file" title="Attach anything (or paste / drop)">＋</button>
        <input id="imgfile" type="file" multiple hidden />
        <input id="prompt" type="text" autocomplete="off" spellcheck="false"
               placeholder="What should Glade become?" />
        <button type="button" id="mic" aria-label="Speak" title="Hold to speak">🎙</button>
        <button type="submit" id="go" aria-label="Send">↵</button>
      </form>
      <div id="dockbar">
        <button type="button" id="harnesspill" class="pill" title="Switch harness">claude</button>
        <span id="hint">glade builds its own interface — ask for anything</span>
        <button type="button" id="palettebtn" class="pill" title="Commands ( / )">／ commands</button>
      </div>
    </div>
  </div>

  <script src="/glass.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
