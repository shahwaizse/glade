<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glade</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- SVG filters for liquid glass (displacement map injected by glass.js) -->
  <svg class="defs" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feImage id="lg-map" href="" x="0" y="0" width="100%" height="100%" result="map" preserveAspectRatio="none" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div id="stage">
    <!-- ambient background -->
    <div class="ambient a1"></div>
    <div class="ambient a2"></div>

    <!-- widget grid -->
    <main id="grid" class="empty"></main>

    <!-- generation window -->
    <div id="genwrap" hidden>
      <div id="genwindow">
        <div class="gen-strips">
          <div class="gen-strip" style="--dur:3.4s;--delay:-0.3s;--blur:14px"><img src="/gen-images/1.jpg" alt="" /></div>
          <div class="gen-strip" style="--dur:2.7s;--delay:-1.8s;--blur:20px"><img src="/gen-images/2.jpg" alt="" /></div>
          <div class="gen-strip" style="--dur:4.1s;--delay:-0.9s;--blur:11px"><img src="/gen-images/3.jpg" alt="" /></div>
          <div class="gen-strip" style="--dur:3.0s;--delay:-2.4s;--blur:16px"><img src="/gen-images/4.jpg" alt="" /></div>
          <div class="gen-strip" style="--dur:2.4s;--delay:-0.6s;--blur:22px"><img src="/gen-images/5.jpg" alt="" /></div>
          <div class="gen-strip" style="--dur:3.8s;--delay:-1.4s;--blur:13px"><img src="/gen-images/6.jpg" alt="" /></div>
        </div>
        <div class="gen-veil"></div>
        <div id="genstatus">conjuring…</div>
      </div>
    </div>

    <!-- env side panel -->
    <aside id="envpanel" class="glass" hidden>
      <h2 id="envtitle">This widget needs a few keys</h2>
      <form id="envform"></form>
      <div class="env-actions">
        <button type="button" id="envsave" class="g-btn primary">Save</button>
        <button type="button" id="envskip" class="g-btn">Later</button>
      </div>
    </aside>

    <!-- command bar -->
    <div id="dock">
      <div id="thumbs" hidden></div>
      <form id="cmd" class="glass">
        <button type="button" id="attach" aria-label="Attach image" title="Attach image (or paste / drop)">＋</button>
        <input id="imgfile" type="file" accept="image/*" multiple hidden />
        <input id="prompt" type="text" autocomplete="off" spellcheck="false"
               placeholder="What should Glade become?" />
        <button type="submit" id="go" aria-label="Send">↵</button>
      </form>
      <div id="hint">glade builds its own interface — ask for anything</div>
    </div>
  </div>

  <script src="/glass.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
